# -----------------------------------------------------------------------------
# Journal club data. Everything on the page is rendered from this file,
# so you never need to edit the page itself.
#
# Photos: put files in assets/img/journal_club/ and reference them below as
# "journal_club/<file>". If the file is missing, the page shows the person's
# initials instead, so nothing breaks while you collect pictures.
#
# Dates: write them as YYYY-MM-DD without quotes. Quote times ("1:00 PM").
# -----------------------------------------------------------------------------

name: Computer Vision Journal Club
tagline: >
  Paper discussions and guest talks on computer vision and machine learning,
  with a focus on human motion and health applications. Run by Dr. Babak
  Taati's group at the University of Toronto, KITE, and the Vector Institute
  since 2019.

# Meeting logistics. A field left blank is not shown.
meeting:
  cadence: Tuesdays
  time: "1:00–2:00 PM ET"
  location: Vector Institute, Schwartz Reisman Innovation Campus, 108 College St, Toronto
  format: "In person at Vector, with Zoom for remote attendees. The Zoom passcode is sent by email."
  contact: kimia.shaban@mail.utoronto.ca
  # Zoom: the recurring meeting link (same ID every week). A "Join on Zoom"
  # button appears when this is set. This page is public, so never put the
  # passcode here or use a link that embeds it (one with "?pwd=" in it).
  zoom_url: https://utoronto.zoom.us/j/86201342625
  zoom_label: Join on Zoom
  # "Join the mailing list" button. There is no list service yet, so this
  # opens an email to Kimia asking to be added. Swap in a Google Group or
  # listserv sign-up link when there is one. A calendar file with the weekly
  # slot and Zoom link is at assets/journal-club.ics for use in emails.
  signup_url: "mailto:kimia.shaban@mail.utoronto.ca?subject=Journal%20club%20mailing%20list"
  signup_label: Join the mailing list

# Link shown under "Past sessions" for the older history.
archive_url: https://www.cs.toronto.edu/~taati/journalclub.html
archive_label: Sessions from 2019 to 2024 are listed on Babak Taati's site.

# Organizing team, in display order.
organizers:
  - name: Kimia Shaban
    role: Lead organizer
    affiliation: PhD student, Computer Science, University of Toronto · Vector Institute · KITE
    image: journal_club/kimia.jpg
    url: https://kimiashaban.github.io/
    bio: >
      Runs the journal club: sets the schedule, invites speakers, and keeps
      this page up to date. Works on computer vision and vision-language
      models.

  - name: Babak Taati
    role: Faculty lead
    affiliation: Senior Scientist, KITE Research Institute, UHN · Associate Professor, Computer Science, University of Toronto · Faculty Affiliate, Vector Institute
    image: journal_club/babak.jpg
    url: https://www.cs.toronto.edu/~taati/
    bio: >
      Holds the Barbara G. Stymiest Chair in Rehabilitation Technology
      Research and leads the KITE Aging Team. Hosts the journal club and
      keeps the long-term archive.

  - name: Vida Adeli
    role: Former organizer
    affiliation: PhD candidate, Computer Science, University of Toronto · Vector Institute · KITE
    image: journal_club/vida.jpg
    url: https://vadeli.github.io/
    bio: >
      Works on generative models for 3D human motion, animation, and clinical
      gait analysis. Organized the journal club before Kimia.

