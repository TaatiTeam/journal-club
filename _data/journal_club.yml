# Upcoming sessions, soonest first. Move an entry to `past` after it happens.
# Only `date` and `speaker` are needed; blank fields are hidden.
#   - date: 2026-11-18
#     speaker: Jane Doe
#     affiliation: University of Toronto
#     speaker_url: ""
#     speaker_image: "" # e.g. journal_club/speakers/jane-doe.jpg (put the file in assets/img/journal_club/speakers/)
#     speaker_email: "" # not shown on the page; makes the speaker a required attendee on the calendar invite
#     title: "Paper or talk title"
#     paper: https://arxiv.org/abs/...
#     abstract: "One or two sentences on what will be discussed."
#     abstract_full: "Optional longer version, used only in the weekly email."
#     time: "" # only if different from the default above
#     location: "" # e.g. the room, or "Zoom only"
upcoming:
  - date: 2026-12-01
    speaker: Jack Lu
    affiliation: NYU Courant
    speaker_url: https://jacklu-me.com
    speaker_image: journal_club/speakers/jack-lu.jpg
    title: "The Surprising Effectiveness of Deleting Weights in LLM Post-Training"
    location: Sobolev Room (W1144), Vector Institute
    abstract: >
      Zeroing fewer than 0.05% of a pretrained LLM's weights, with no other
      change, matches full fine-tuning across three post-training regimes:
      reinforcement learning with verifiable rewards, supervised fine-tuning,
      and on-policy distillation. The method, Deletion Tuning, learns a binary
      mask over the gate projection of transformer blocks. The mask is hundreds
      to thousands of times smaller than a full checkpoint and forgets far
      less of what the model knew before.
    # Used only by tools/announce.py (the weekly email); the page shows `abstract`.
    abstract_full: >
      How little of a pretrained large language model (LLM) has to change for
      it to acquire new capabilities? We find that zeroing fewer than 0.05% of
      its weights, with no other modification, matches full fine-tuning (FFT)
      at scale across three LLM post-training regimes: reinforcement learning
      with verifiable rewards, supervised fine-tuning, and on-policy
      distillation. Our method, Deletion Tuning, learns a binary mask over the
      gate projection of transformer blocks. Two practical advantages follow:
      the trained mask is hundreds to thousands of times smaller than the
      corresponding FFT checkpoint, and Deletion Tuning forgets far less,
      which addresses a central challenge in continual learning. Under
      reinforcement learning, its prior-task accuracy stays near the base
      level while FFT, LoRA, and random sparse fine-tuning lose up to 5.4
      points. To understand why masking alone suffices, we analyze the
      geometry of the learned weight changes under reinforcement learning
      using stable rank, spectrum drift, and principal-weight overlap. Compared
      with LoRA and random sparse fine-tuning, Deletion Tuning is closest to
      FFT across the three measures.

