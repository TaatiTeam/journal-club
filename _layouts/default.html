<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>
      {{ site.data.journal_club.name | default: site.title | escape }}
    </title>
    <meta name="description" content="{{ site.description | escape }}">
    <meta
      property="og:title"
      content="{{ site.data.journal_club.name | default: site.title | escape }}"
    >
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    >
    <script>
      // Embed mode: another site (e.g. kimiashaban.github.io/journal-club/)
      // shows this page in an iframe with ?embed=1&theme=light|dark. Hides
      // the header and footer and follows the host's colour theme.
      (function () {
        var q = new URLSearchParams(location.search);
        if (!q.has("embed")) return;
        var h = document.documentElement;
        h.classList.add("embed");
        var t = q.get("theme");
        if (t === "dark" || t === "light") h.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a
        class="site-brand"
        href="{{ '/' | relative_url }}"
        aria-label="Journal club home"
      >
        <span>Journal Club<span class="brand-caption">University of Toronto · KITE · Vector</span></span>
      </a>
      <nav aria-label="Main navigation">
        <a href="#upcoming">Schedule</a>
        <a href="#team">People</a>
        {% if site.data.journal_club.past.size > 0 -%}
          <a href="#past">Archive <span aria-hidden="true">↗</span></a>
        {%- endif %}
      </nav>
    </header>
    <main id="main" class="wrap" tabindex="-1">{{ content }}</main>
    <footer class="site-footer wrap">
      <a class="footer-brand" href="{{ '/' | relative_url }}">Computer vision. Shared perspectives.</a>
      <p>University of Toronto · KITE · Vector Institute <span aria-hidden="true">/</span> Since 2019</p>
    </footer>
    <script>
      (function () {
        var h = document.documentElement;
        if (!h.classList.contains("embed") || window.parent === window) return;
        var send = function () {
          parent.postMessage({ journalClubHeight: h.scrollHeight }, "*");
        };
        new ResizeObserver(send).observe(document.body);
        window.addEventListener("load", send);
        // Links to other sites leave the frame instead of opening inside it.
        document.querySelectorAll('a[href^="http"], a[href^="mailto:"]').forEach(function (a) {
          a.target = "_top";
        });
        window.addEventListener("message", function (e) {
          var t = e.data && e.data.journalClubTheme;
          if (t === "dark" || t === "light") h.setAttribute("data-theme", t);
        });
      })();
    </script>
  </body>
</html>
